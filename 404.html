<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#8B1A1A" />
  <title>Página não encontrada — Linde Guia</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --borde:#8B1A1A; --creme:#F5F0E8; --tinta:#1C1714; --tinta-suave:#4A3F38; }
    @media (prefers-color-scheme: dark) { :root { --creme:#1C1714; --tinta:#F5F0E8; --tinta-suave:#D8CFC0; --borde:#E5B96A; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
           background:var(--creme); color:var(--tinta); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:34rem; }
    h1 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(1.8rem,6vw,2.6rem); line-height:1.15; margin:0 0 .75rem; }
    p { color:var(--tinta-suave); line-height:1.6; margin:0 0 1.5rem; }
    a { display:inline-block; padding:.8rem 1.4rem; border-radius:999px; background:var(--borde); color:#fff; text-decoration:none; font-weight:600; }
    a:focus-visible { outline:3px solid currentColor; outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <h1>Esse caminho não leva a lugar nenhum</h1>
    <p>O endereço pode ter mudado ou estar digitado errado. Volte ao início para montar seu passeio por Treze Tílias.</p>
    <a href="/">Voltar ao início</a>
  </main>
</body>
</html>
