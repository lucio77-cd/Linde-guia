name: Validacao estatica

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  validar:
    name: JavaScript e JSON
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar sintaxe dos módulos JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' arquivo; do
            echo "Verificando: $arquivo"
            node --input-type=module --check < "$arquivo"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Validar arquivos JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' arquivo; do
            echo "Validando: $arquivo"
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$arquivo"
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)
